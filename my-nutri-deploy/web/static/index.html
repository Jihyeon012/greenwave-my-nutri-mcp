<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My-Nutri 영양제 점검</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --fg:#1c1c1e; --muted:#6b6b70; --line:#e3e5ea; --accent:#2e9e6a; --warn:#b4531a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181b; --card:#222428; --fg:#f2f2f5; --muted:#9a9aa2; --line:#33363c; --accent:#46c08a; --warn:#f0a56a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  main { max-width:820px; margin:0 auto; padding:20px 16px 120px; }
  h1 { font-size:20px; margin:4px 0; } .sub { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:12px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:3px; }
  input,select,textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  button { cursor:pointer; border:0; border-radius:8px; padding:10px 16px; background:var(--accent); color:#fff; font:inherit; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .chip { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:400; padding:6px 10px; margin:4px 4px 0 0; font-size:13px; }
  .tool { border-left:4px solid var(--accent); } .tool h3 { margin:0 0 6px; font-size:13px; color:var(--muted); font-weight:600; }
  .ai { color:var(--fg); } .ai h3 { margin:0 0 6px; font-size:13px; color:var(--muted); font-weight:600; }
  .me { background:var(--accent); color:#fff; border:0; margin-left:auto; max-width:85%; }
  .err { border-left:4px solid var(--warn); }
  table { border-collapse:collapse; display:block; overflow-x:auto; margin:8px 0; } th,td { border:1px solid var(--line); padding:5px 8px; font-size:13px; white-space:nowrap; } th { background:var(--bg); }
  blockquote { margin:8px 0; padding:2px 12px; border-left:3px solid var(--line); color:var(--muted); }
  .notice { font-size:12.5px; color:var(--muted); }
  #bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; }
  #bar div { max-width:820px; margin:0 auto; display:flex; gap:8px; }
</style>
</head>
<body>
<main>
  <h1>My-Nutri 영양제 점검</h1>
  <p class="sub">식약처 공공데이터로 영양제의 섭취량·병용금기·업체·해외직구 차단 여부를 확인합니다. AI는 설명하고, My-Nutri는 확인합니다.</p>

  <div class="card">
    <div class="grid">
      <div><label>성별</label><select id="sex"><option value="">선택 안 함</option><option>여</option><option>남</option></select></div>
      <div><label>만 나이</label><input id="age" type="number" min="19" max="120" placeholder="예: 34"></div>
      <div><label>복용 중인 약</label><input id="meds" placeholder="예: 와파린, 디곡신"></div>
      <div><label>몸 상태</label><input id="conds" placeholder="예: 임신 준비, 고혈압"></div>
    </div>
    <p class="notice">입력한 정보는 질문과 함께 AI 서버로 전송되지만 이 사이트가 저장하지 않으며, 대화 기록은 이 화면에만 남습니다(새로고침하면 사라집니다).</p>
    <label style="display:flex;gap:8px;align-items:flex-start;color:var(--fg)"><input id="consent" type="checkbox" style="width:auto;margin-top:5px">
      <span>복용 약·질환 같은 건강 정보가 점검을 위해 외부 AI 서비스(Anthropic)와 공공데이터 서버로 전송되는 것에 동의합니다.</span></label>
  </div>

  <div id="chips">
    <button class="chip">센트룸 데일리 뉴트리션 팩 30 여성 프로 안전 점검해줘</button>
    <button class="chip">Kava Kava 해외직구 제품 차단 목록에 있어?</button>
    <button class="chip">한미루테인골드 효과 볼 만큼 들어 있어?</button>
    <button class="chip">타이레놀, 이부프로펜 효능군 중복이야?</button>
  </div>
  <div id="log"></div>
  <p class="notice">공공 데이터 기반 참고 자료이며 의학적 판단을 대신하지 않습니다. 목록에 없다는 것이 안전하다는 뜻은 아닙니다. 복용 중인 약이나 질환이 있으면 의사·약사와 확인하세요.</p>
</main>
<div id="bar"><div><textarea id="q" rows="1" placeholder="영양제 이름이나 궁금한 점을 입력하세요"></textarea><button id="send">보내기</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const history = [];          // 브라우저 메모리에만 보관 (저장하지 않음)
const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send");
const NAMES = { full_safety_check:"종합 안전 점검", check_effective_dose:"유효량 체크", check_nutrient_adequacy:"권장섭취량 대비", check_drug_interactions:"병용금기(DUR)",
  check_overseas_product:"해외직구 차단 확인", check_ad_claims:"광고 팩트체크", check_manufacturer_status:"업체 신뢰 확인", check_duplicate_spending:"중복 지출",
  check_drug_efficacy_duplicate:"약 효능군 중복", check_recall_history:"회수 이력", search_nutri_product:"제품 검색", compare_nutri_products:"제품 비교" };

function add(cls, html, title) {
  const d = document.createElement("div"); d.className = "card " + cls;
  d.innerHTML = (title ? "<h3>" + title + "</h3>" : "") + DOMPurify.sanitize(html);
  log.appendChild(d); d.scrollIntoView({ block: "end", behavior: "smooth" }); return d;
}
const md = t => marked.parse(t || "", { breaks: true });

function buildPrompt(text) {
  const p = [], v = id => document.getElementById(id).value.trim();
  if (v("sex")) p.push("성별 " + v("sex")); if (v("age")) p.push("나이 " + v("age") + "세");
  if (v("meds")) p.push("복용 약 " + v("meds")); if (v("conds")) p.push("몸 상태 " + v("conds"));
  return p.length ? text + "\n\n[내 정보] " + p.join(", ") : text;
}

async function ask(text) {
  if (!text) return;
  if (!document.getElementById("consent").checked) { add("err", "<p>먼저 위의 개인정보 전송 동의에 체크해 주세요.</p>"); return; }
  add("me", "<p>" + text.replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c])) + "</p>");
  history.push({ role: "user", content: buildPrompt(text) });
  send.disabled = true; q.value = "";
  const wait = add("ai", "<p>식약처 데이터를 확인하는 중입니다… (처음에는 30초 정도 걸릴 수 있습니다)</p>");
  try {
    const res = await fetch("/api/chat", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ messages: history.slice(-10), consent: true }) });
    const data = await res.json();
    wait.remove();
    if (!res.ok) { add("err", "<p>" + (data.detail || "오류가 발생했습니다.") + "</p>"); history.pop(); return; }
    data.tools.forEach(t => add(t.error ? "err" : "tool", md(t.text), "My-Nutri 확인 결과 · " + (NAMES[t.name] || t.name)));
    if (data.text) add("ai", md(data.text), "AI 요약");
    history.push({ role: "assistant", content: data.text || "(도구 결과 참고)" });
  } catch (e) { wait.remove(); add("err", "<p>네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</p>"); history.pop(); }
  finally { send.disabled = false; }
}
send.onclick = () => ask(q.value.trim());
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value.trim()); } });
document.querySelectorAll(".chip").forEach(b => b.onclick = () => ask(b.textContent));
</script>
</body>
</html>
